<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <!-- Empty favicon: without a declared icon browsers request /favicon.ico and log a 404. -->
    <link rel="icon" href="data:," />
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
    <title data-i18n="ui.title"></title>
    <style>
      :root {
        --asphalt: #2e2f33;
        --chalk: #eeebe3;
        --kiosk: #f4c542;
        --kiosk-ink: #2a2208;
        --marker: #e0493c;
        --holo: #45c4b0;
        --panel: #f1eee6;
        --panel-ink: #202124;
        --panel-muted: #5d5f66;
        --panel-line: #d6d1c4;
        --chalk-font: 'Neucha', 'Comic Sans MS', 'Segoe Print', cursive;
        --ui-font: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* V18 menu theme (approved «Двор» mockup): the menu is the yard itself — dark asphalt,
           chalk drawing, «картонка» buttons with a solid bottom edge. Always dark, so it is not
           switched by prefers-color-scheme; --panel* keeps owning the themed cards. */
        --menu-bg: #1b1c1e;
        --menu-panel: #26272b;
        --menu-ink: #f1eee6;
        --menu-mute: #b9b5a8;
        --menu-red: #e24a3a;
        --menu-red-dark: #a8321f;
        --menu-yellow: #f2c230;
        --menu-radius: 16px;
        --menu-gap: 12px;
        --menu-cardboard: 0 4px 0 rgba(0, 0, 0, 0.45);
        --menu-cardboard-press: 0 2px 0 rgba(0, 0, 0, 0.45);
        --tutor-space: 0px;
        /* V17: --safe-* mirror the platform's overlay claims (PlatformAdapter.safeInsets — VK
           chat button, system bars); --inset-* = max(device cutout, platform claim). */
        --safe-top: 0px;
        --safe-right: 0px;
        --safe-bottom: 0px;
        --safe-left: 0px;
        --inset-top: max(env(safe-area-inset-top, 0px), var(--safe-top));
        --inset-right: max(env(safe-area-inset-right, 0px), var(--safe-right));
        --inset-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-bottom));
        --inset-left: max(env(safe-area-inset-left, 0px), var(--safe-left));
        box-sizing: border-box;
        padding-top: var(--inset-top);
        padding-bottom: var(--inset-bottom);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --panel: #26272b;
          --panel-ink: #ece9e1;
          --panel-muted: #a3a39e;
          --panel-line: #3b3c41;
        }
      }
      :root[data-theme='dark'] {
        --panel: #26272b;
        --panel-ink: #ece9e1;
        --panel-muted: #a3a39e;
        --panel-line: #3b3c41;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      html {
        scroll-padding-top: var(--inset-top);
        background: var(--asphalt);
      }
      body {
        background: var(--asphalt);
        color: var(--chalk);
        font-family: var(--ui-font);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }

      /* chalk scoreboard */
      #hud {
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        padding: calc(var(--inset-top) + 14px) 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        pointer-events: none;
        font-family: var(--chalk-font);
      }
      .score {
        min-width: 0;
      }
      .score.p1 {
        text-align: right;
      }
      .pname {
        display: block;
        font-size: clamp(18px, 4.2vw, 26px);
        opacity: 0.85;
      }
      .pnum {
        display: block;
        font-size: clamp(40px, 10vw, 64px);
        line-height: 0.95;
      }
      .score.active .pname {
        color: var(--kiosk);
        opacity: 1;
      }
      .score.active .pname::after {
        content: ' ←';
      }
      .score.p1.active .pname::after {
        content: '';
      }
      .score.p1.active .pname::before {
        content: '→ ';
      }
      .dots {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        margin-top: 6px;
        max-width: 150px;
      }
      .score.p1 .dots {
        justify-content: flex-end;
        margin-left: auto;
      }
      .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: block;
        background-size: cover;
        background-position: center;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      }
      /* 320 px wide: two full 24-dot columns must still leave room for "в стопке: N" between them. */
      @media (max-width: 430px) {
        #hud {
          padding-left: 10px;
          padding-right: 10px;
        }
        .dots {
          max-width: 78px;
          gap: 2px;
        }
        .dots i {
          width: 8px;
          height: 8px;
        }
        #pot {
          max-width: 40vw;
        }
        #hint {
          max-width: 100%;
        }
      }
      #pot {
        text-align: center;
        font-size: clamp(17px, 3.8vw, 22px);
        opacity: 0.8;
        padding-top: 6px;
      }
      #hint {
        display: block;
        font-size: clamp(15px, 3.4vw, 19px);
        opacity: 0.75;
        margin-top: 4px;
        max-width: 46vw;
      }
      /* V10: the idle-turn nudge and countdown, brighter than the hint so it reads as a warning */
      #turnTimer {
        display: block;
        font-size: clamp(15px, 3.4vw, 19px);
        color: var(--kiosk);
        font-weight: 700;
        margin-top: 2px;
      }
      #turnTimer:empty {
        display: none;
      }
      /* V21: the same countdown mirrored as a pill ABOVE every menu — the HUD line is covered,
         and a dialog must never hide the last seconds of the player's turn. z-index 15 sits
         over the menus (10–13) and the tutorial (14); #boot (30) still covers it while loading. */
      #menuTimer {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 10px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
        max-width: 92vw;
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--kiosk);
        color: var(--kiosk-ink);
        font: 700 clamp(14px, 3.2vw, 17px)/1.3 var(--ui-font);
        text-align: center;
        pointer-events: none;
      }

      #log {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--inset-bottom) + 96px);
        width: min(92vw, 560px);
        text-align: center;
        font-family: var(--chalk-font);
        font-size: clamp(20px, 4.6vw, 28px);
        line-height: 1.2;
        pointer-events: none;
        text-shadow:
          0 1px 3px rgba(0, 0, 0, 0.85),
          0 0 8px rgba(0, 0, 0, 0.5);
      }

      /* controls */
      #controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0 14px calc(var(--inset-bottom) + 14px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .iconbtn {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.35);
        color: var(--chalk);
        cursor: pointer;
        display: grid;
        place-items: center;
        flex: none;
        pointer-events: auto;
        text-shadow: none;
      }
      .iconbtn svg {
        width: 22px;
        height: 22px;
      }
      #throwBtn {
        position: relative;
        width: min(100%, 520px);
        height: 64px;
        border: 0;
        border-radius: 16px;
        background: var(--kiosk);
        color: var(--kiosk-ink);
        font: 700 19px/1 var(--ui-font);
        cursor: pointer;
        overflow: hidden;
        touch-action: none;
        box-shadow: 0 4px 0 #b88f1d;
      }
      #throwBtn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #b88f1d;
      }
      #throwBtn[disabled] {
        opacity: 0.45;
        cursor: default;
        transform: none;
        box-shadow: 0 4px 0 #b88f1d;
      }
      #throwBtn .fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: var(--marker);
        opacity: 0.85;
      }
      #throwBtn .lbl {
        position: relative;
      }
      #throwBtn .notch {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: rgba(42, 34, 8, 0.35);
      }
      #throwBtn .fill.hot {
        background: #b3261e;
      }
      [hidden] {
        display: none !important;
      }
      /* corner tools: stack order and strike mode share the left side as one pair (V24 — the
         bottom-right corner stays clear of the platform's chat button, desktop VK included) */
      #actionRow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        width: 100%;
      }
      #toolPair {
        display: flex;
        gap: 10px;
      }
      /* the throw takes the space right of the pair (centred in it where it can afford its 520px
         cap); nothing sits at the bottom-right corner */
      #actionRow #throwBtn {
        justify-self: center;
      }
      .toolbtn {
        position: relative;
        width: 64px;
        height: 64px;
        padding: 5px 0 5px;
        border: 1.5px solid rgba(238, 235, 227, 0.38);
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.42);
        color: var(--chalk);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        font: 500 9.5px/1 var(--ui-font);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .toolbtn svg {
        width: 38px;
        height: 38px;
        flex: none;
      }
      .toolbtn:hover {
        background: rgba(0, 0, 0, 0.58);
        border-color: rgba(238, 235, 227, 0.65);
      }
      .toolbtn:active {
        transform: translateY(1px);
      }
      .toolbtn[disabled] {
        opacity: 0.38;
        cursor: default;
        transform: none;
      }
      .toolbtn:focus-visible {
        outline: 3px solid var(--kiosk);
        outline-offset: 2px;
      }
      #windInd {
        width: 56px;
        height: 56px;
        flex: none;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.42);
        border: 1.5px solid rgba(238, 235, 227, 0.3);
        pointer-events: none;
      }
      #windInd svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #windInd .wdial {
        fill: none;
        stroke: rgba(238, 235, 227, 0.2);
        stroke-width: 1;
        stroke-dasharray: 2 3;
      }
      #windFlag {
        fill: var(--marker);
        stroke: rgba(238, 235, 227, 0.85);
        stroke-width: 1;
        stroke-linejoin: round;
      }
      #windInd .wpole {
        fill: var(--chalk);
        stroke: rgba(0, 0, 0, 0.4);
        stroke-width: 0.8;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      .hudcol {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .hudL {
        align-items: flex-start;
      }
      .hudR {
        align-items: flex-end;
      } /* the wind badge and the lab button hang under the score and its dots, so they never cover them */

      /* stack-order popup */
      #orderOverlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 21, 23, 0.72);
        z-index: 10;
        padding: 18px 18px calc(18px + var(--inset-bottom));
      }
      .card.ordercard {
        text-align: left;
        display: flex;
        flex-direction: column;
        width: min(100%, 420px);
        max-height: min(94vh, 760px);
        padding: 18px 16px 14px;
      }
      .card.ordercard h2 {
        font-size: 28px;
        margin: 0 0 4px;
      }
      .card.ordercard .ordernote {
        font-size: 13px;
        line-height: 1.35;
        color: var(--panel-muted);
        margin: 0 0 10px;
      }
      #orderList {
        list-style: none;
        margin: 0 0 4px;
        padding: 2px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-height: 0;
      }
      .orow {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 3px 4px 3px 10px;
        border: 1px solid var(--panel-line);
        border-radius: 12px;
        background: rgba(127, 127, 127, 0.08);
      }
      .orow.drag {
        background: var(--panel);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        border-color: var(--panel-ink);
        position: relative;
        z-index: 1;
      }
      .orank {
        width: 16px;
        text-align: center;
        font: 500 13px var(--ui-font);
        color: var(--panel-muted);
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .oimg {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 2px solid #d9d4c7;
        flex: none;
      }
      .oimg.holo {
        border-color: #45c4b0;
      }
      .oimg.boss {
        border-color: #d4a017;
      }
      .oname {
        flex: 1;
        min-width: 0;
        font: 500 15px/1.2 var(--ui-font);
      }
      .oname small {
        display: block;
        font: 400 11px var(--ui-font);
        color: var(--panel-muted);
      }
      .oarrows {
        display: flex;
        gap: 4px;
        flex: none;
      }
      .oarrow {
        width: 44px;
        height: 44px;
        border: 1px solid var(--panel-line);
        background: transparent;
        color: var(--panel-ink);
        border-radius: 9px;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .oarrow svg {
        width: 16px;
        height: 16px;
      }
      .oarrow[disabled] {
        opacity: 0.28;
        cursor: default;
      }
      .oarrow:focus-visible,
      .ohandle:focus-visible {
        outline: 2px solid var(--marker);
        outline-offset: 1px;
      }
      .ohandle {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        color: var(--panel-muted);
        cursor: grab;
        touch-action: none;
        flex: none;
      }
      .ohandle:active {
        cursor: grabbing;
      }
      .ohandle svg {
        width: 16px;
        height: 16px;
      }
      button:focus-visible {
        outline: 3px solid var(--holo);
        outline-offset: 2px;
      }
      .btn {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--panel-line);
        background: transparent;
        color: var(--panel-ink);
        font: 500 14px var(--ui-font);
        padding: 11px;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 8px;
      }
      .btn.primary {
        background: var(--marker);
        border-color: var(--marker);
        color: #fff;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: default;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(20, 21, 23, 0.72);
        z-index: 10;
        padding: 24px 24px calc(24px + var(--inset-bottom));
      }
      .card {
        background: var(--panel);
        color: var(--panel-ink);
        border-radius: 18px;
        padding: 26px 24px;
        width: min(100%, 380px);
        text-align: center;
      }
      .card h2 {
        font: 400 34px/1.1 var(--chalk-font);
        margin: 0 0 10px;
      }
      .card p {
        margin: 0 0 16px;
        line-height: 1.45;
        font-size: 15px;
      }

      /* result screen (B5, V20 redesign): the same full-screen dark sheet as «Двор» — verdict on
         top, the «Ты забрал»/«У тебя забрали» plates scroll in the middle (.resmain), the action
         buttons stay pinned to the bottom so a hint or a short screen can never cover them. */
      #overlay.resfull {
        padding: 0;
        place-items: stretch;
        background: radial-gradient(110% 55% at 50% 22%, #33302a 0%, var(--menu-bg) 65%);
      }
      .card.rescard {
        /* 12px side insets keep a sliver of tutorial backdrop clickable around the full-height
           card (V5 'over' step); the card is transparent, so the screen still reads full-bleed */
        width: min(calc(100% - 24px), 460px);
        height: 100%;
        margin: 0 auto;
        padding: calc(var(--inset-top) + 20px) 20px calc(var(--inset-bottom) + 18px);
        border-radius: 0;
        background: transparent;
        color: var(--menu-ink);
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: hidden;
      }
      .reshead {
        flex: none;
        text-align: center;
      }
      .reskick {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--menu-yellow);
      }
      .card.rescard h2 {
        font-size: clamp(44px, 14vw, 64px);
        line-height: 1;
        margin: 4px 0 0;
      }
      .resscore {
        margin-top: 8px;
        font-size: 17px;
        font-variant-numeric: tabular-nums;
        color: #d9d4c4;
      }
      .resscore b {
        color: var(--menu-ink);
      }
      .resnote {
        margin-top: 10px;
        font-size: 14px;
        line-height: 1.4;
        color: var(--menu-mute);
      }
      .resmain {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ressec {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border-radius: 18px;
        background: rgba(241, 238, 230, 0.06);
        border: 1px solid rgba(241, 238, 230, 0.16);
      }
      .ressec.dim {
        background: rgba(241, 238, 230, 0.04);
        border-color: rgba(241, 238, 230, 0.12);
      }
      .ressechead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .ressechead .resname {
        font: 600 15px var(--ui-font);
      }
      .ressechead .rescount {
        font: 600 22px var(--ui-font);
        color: var(--menu-yellow);
        font-variant-numeric: tabular-nums;
      }
      .ressec.dim .rescount {
        font-size: 18px;
        color: var(--menu-mute);
      }
      .reschips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .resdot {
        position: relative;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 2px solid rgba(255, 255, 255, 0.2);
      }
      .ressec.dim .resdot {
        width: 38px;
        height: 38px;
        opacity: 0.55;
        border-color: rgba(255, 255, 255, 0.15);
      }
      .resnew {
        position: absolute;
        top: -8px;
        right: -10px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--menu-red);
        color: #fff;
        font: 600 10px var(--ui-font);
        white-space: nowrap;
      }
      .resstats {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-size: 14px;
        color: var(--menu-mute);
        text-align: center;
      }
      .resstats b {
        color: var(--menu-ink);
        font-variant-numeric: tabular-nums;
      }
      .reswarn {
        color: #ff9a8c;
        font-size: 13px;
      }
      .resfoot {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .resfoot .btn {
        margin-top: 0;
        min-height: 52px;
        padding-left: 6px;
        padding-right: 6px;
        border: 1px solid rgba(241, 238, 230, 0.24);
        border-radius: 14px;
        background: rgba(241, 238, 230, 0.07);
        color: var(--menu-ink);
        font-size: 16px;
      }
      .resfoot .btn.primary {
        min-height: 58px;
        border: 0;
        border-radius: 16px;
        background: var(--menu-red);
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        box-shadow: 0 5px 0 #7d2219;
      }
      .resfoot .btn.primary:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #7d2219;
      }
      .resacts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      /* V4: «Рассказать друзьям» is a quiet text link, not a plate */
      .btn.reshare {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--menu-yellow);
        font-size: 15px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* stake screen (R1b, docs/STAKE-SCREEN.md): circles, not rows; the card is a flex column on
         phones, a 300px stakes column + collection grid on wide screens */
      #stakeOverlay {
        position: fixed;
        inset: 0;
        display: grid;
        /* the collection grid's max-content would blow the card past the viewport: the track
           must be capped, so cell percentages never see the content-sized width */
        grid-template-columns: minmax(0, 560px);
        place-content: center;
        background: rgba(20, 21, 23, 0.72);
        z-index: 11; /* above the result card, which stays visible under it when re-staking */
        padding: 12px 12px calc(12px + var(--inset-bottom));
      }
      .card.stakecard {
        --sdisc: 52px; /* face size of a stake circle */
        --sgap: 0.625rem; /* gap between .sdisc boxes: ~10px between 52px faces, badges included */
        --scell: 44px; /* min column width of a collection cell — sets tiles-per-row */
        position: relative;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        max-height: min(96vh, 860px);
        padding: 12px 14px;
      }
      .stakehead {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        flex: none;
      }
      .card.stakecard h2 {
        font-size: 30px;
        margin: 0;
      }
      .stakeopponent {
        font: 500 14px var(--ui-font);
        color: var(--panel-muted);
        white-space: nowrap;
      }
      .staketop {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      .stakelbl {
        font: 500 13px var(--ui-font);
        color: var(--panel-muted);
        white-space: nowrap;
      }
      .stakecap {
        font: 500 13px var(--ui-font);
        color: var(--panel-muted);
        white-space: nowrap;
      }
      #stakeCount {
        font: 700 24px/1 var(--ui-font);
        min-width: 30px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .sstep {
        width: 44px;
        height: 44px;
        border: 1px solid var(--panel-line);
        background: transparent;
        color: var(--panel-ink);
        border-radius: 12px;
        font-size: 22px;
        cursor: pointer;
        display: grid;
        place-items: center;
        padding: 0;
      }
      .sstep[disabled] {
        opacity: 0.3;
        cursor: default;
      }
      .stakeexit {
        width: auto;
        margin: 0 0 0 auto; /* auto margin keeps it pinned right when the stepper wraps below */
        padding: 0 14px;
        white-space: nowrap;
        flex: none;
      }
      .stakemain {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        /* V15: too little height (a 10-fishka stake on a small phone) scrolls the card's middle
           instead of letting the collection block and the swap hint paint over the bottom bar */
        overflow-y: auto;
      }
      .stakeleft {
        flex: none;
      }
      .stakestake {
        display: flex;
        flex-direction: column;
      }
      .stakehalf {
        min-width: 0;
      }
      .stakesec {
        font: 500 13px var(--ui-font);
        color: var(--panel-muted);
        margin: 6px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        display: flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stakerow {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sgap);
        min-height: 44px;
        align-items: flex-start;
      }
      /* a stake circle: the box follows the face and stays ≥44px for touch */
      .sdisc {
        position: relative;
        width: var(--sdisc);
        height: var(--sdisc);
        min-width: 44px;
        min-height: 44px;
        flex: none;
        display: grid;
        place-items: center;
        border: 0;
        background: none;
        padding: 0;
      }
      button.sdisc {
        cursor: pointer;
      }
      .sdface {
        width: var(--sdisc);
        height: var(--sdisc);
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 2px solid #d9d4c7;
      }
      .sdface.holo {
        border-color: #45c4b0;
      }
      .sdface.boss {
        border-color: #d4a017;
      }
      .sdot .sdface {
        border-style: dashed;
        border-color: var(--panel-line);
      }
      /* a fishka the bot refuses: red ring + the «замена» plate */
      .sdisc.sref .sdface {
        border-color: var(--marker);
        box-shadow: 0 0 0 2px var(--marker);
      }
      .sdx {
        position: absolute;
        top: 0;
        right: 0;
        width: 16px;
        height: 16px;
        border-radius: 8px;
        background: var(--marker);
        color: #fff;
        font: 700 11px/16px var(--ui-font);
        text-align: center;
      }
      .splate {
        position: absolute;
        left: 50%;
        bottom: -3px;
        transform: translateX(-50%);
        background: var(--marker);
        color: #fff;
        font: 600 9px/1 var(--ui-font);
        padding: 3px 6px;
        border-radius: 999px;
        white-space: nowrap;
      }
      /* V11: every bot-staked circle is a replacement request; the yellow plate says so. */
      .sdisc.sask .splate {
        background: var(--kiosk);
        color: var(--kiosk-ink);
      }
      .sdisc.sask[disabled] {
        cursor: default;
      }
      .sdisc.sask[disabled] .splate {
        background: var(--panel-line);
        color: var(--panel-muted);
      }
      .schip {
        font: 500 10.5px var(--ui-font);
        color: var(--panel-muted);
        border: 1px solid var(--panel-line);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .schip.resnew {
        color: #fff;
        background: var(--marker);
        border-color: var(--marker);
      }
      .sbtn {
        min-width: 44px;
        min-height: 44px;
        border: 1px solid var(--panel-line);
        background: transparent;
        color: var(--panel-ink);
        border-radius: 9px;
        cursor: pointer;
        font: 500 12px var(--ui-font);
        padding: 0 10px;
      }
      .sbtn.sremove {
        padding: 0;
        font-size: 15px;
      }
      /* bot's line + the veto counter — the line is height-capped so notes can never cover the
         collection below (R3) */
      .staketalk {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex: none;
        /* V22: two counters («Отказов» + «Запросов») make the chip wide — on a narrow card it
           wraps under the bot's line instead of squeezing the hint to nothing */
        flex-wrap: wrap;
      }
      #stakeHint {
        flex: 1;
        min-width: 140px; /* V22: below this the counter chip wraps to its own line (.staketalk) */
        min-height: 1.3em;
        max-height: 3.9em;
        overflow-y: auto;
        overflow-wrap: break-word;
        margin: 4px 0;
        font-size: 12.5px;
        line-height: 1.3;
        color: var(--panel-muted);
      }
      .stakeref {
        flex: none;
        font: 500 12px var(--ui-font);
        color: var(--panel-muted);
        border: 1px solid var(--panel-line);
        border-radius: 999px;
        padding: 3px 9px;
        margin-top: 4px;
        white-space: nowrap;
      }
      /* V22: the bot's swap offer card — circles the bot would take + «Оставить мою». */
      .stakeoffer {
        flex: none;
        margin: 2px 0;
        padding: 6px 10px;
        border: 1px solid var(--panel-line);
        border-radius: 12px;
        background: rgba(127, 127, 127, 0.08);
      }
      .stakeoffertext {
        margin: 0 0 4px;
        font-size: 12.5px;
        line-height: 1.3;
      }
      .stakeofferrow {
        display: flex;
        align-items: center;
        gap: var(--sgap);
        flex-wrap: wrap;
      }
      .stakeofferopts {
        flex: 1;
      }
      .stakeofferno {
        width: auto;
        margin: 0;
        flex: none;
      }
      /* the «взять» plate under an offered circle is green — the bot accepts it for sure */
      .sdisc.sofer .splate {
        background: #3f9e5c;
        color: #fff;
      }
      .stakecoll {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .stakecollhint {
        font: 400 11.5px var(--ui-font);
        color: var(--panel-muted);
        text-transform: none;
        letter-spacing: 0;
      }
      .stakecollhint.h-touch {
        display: none;
      }
      @media (hover: none) {
        .stakecollhint.h-hover {
          display: none;
        }
        .stakecollhint.h-touch {
          display: inline;
        }
      }
      .stakegrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--scell), 1fr));
        gap: 8px;
        overflow-y: auto;
        flex: 1;
        min-height: calc(var(--scell) + 8px);
        padding: 2px;
        align-content: start;
      }
      .scell {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid #d9d4c7;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        padding: 0;
      }
      .scell.holo {
        border-color: #45c4b0;
      }
      .scell.boss {
        border-color: #d4a017;
      }
      .scell[disabled] {
        opacity: 0.35;
        cursor: default;
      }
      /* a design already in the stake */
      .scell.sat {
        border-color: var(--marker);
        box-shadow: 0 0 0 2px var(--marker);
      }
      /* R12: while a refusal is pending, acceptable cells get a ✓ badge, the rest dim */
      .scell.sok {
        border-color: #3f9e5c;
        box-shadow: 0 0 0 2px #3f9e5c;
      }
      .scell.sdim {
        opacity: 0.35;
      }
      .sokmark {
        position: absolute;
        left: -4px;
        top: -4px;
        width: 20px;
        height: 20px;
        border-radius: 10px;
        background: #3f9e5c;
        color: #fff;
        font: 700 12px/20px var(--ui-font);
        text-align: center;
      }
      .stakeswap {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.3;
        color: var(--panel-muted);
        text-align: center;
        flex: none;
      }
      .scount {
        position: absolute;
        right: -4px;
        bottom: -4px;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        background: var(--kiosk);
        color: var(--kiosk-ink);
        font: 700 11px/20px var(--ui-font);
        text-align: center;
        padding: 0 4px;
      }
      .stakeloan {
        margin: 8px 0;
        padding: 14px;
        border: 1px dashed var(--panel-line);
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
        text-align: center;
      }
      .stakefoot {
        flex: none;
        display: flex;
        gap: 10px;
      }
      .stakefoot .btn {
        margin: 0;
        flex: 1;
      }
      .staketip {
        position: absolute;
        z-index: 2;
        background: var(--panel-ink);
        color: var(--panel);
        font: 500 12px/1 var(--ui-font);
        padding: 7px 10px;
        border-radius: 8px;
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      }

      /* narrow header: the stepper takes its own line, leaving title + «На двор» on the first */
      @media (max-width: 560px) {
        .staketop {
          order: 3;
          flex-basis: 100%;
          margin-left: 0;
          justify-content: center;
        }
      }

      /* small phone (320–380): 36px stake circles, the «На двор» exit is an icon at the bar */
      @media (max-width: 380px) {
        .card.stakecard {
          --sdisc: 36px;
        }
        .stakeexit {
          position: absolute;
          right: 10px;
          bottom: 10px;
          width: 44px;
          height: 44px;
          padding: 0;
          font-size: 0;
        }
        .stakeexit::before {
          content: '←';
          font-size: 20px;
        }
        .stakefoot {
          padding-right: 54px;
        }
      }

      /* tablet portrait (768×1024): the two stakes sit side by side, bigger collection cells */
      @media (min-width: 700px) and (max-width: 1023px) {
        #stakeOverlay {
          grid-template-columns: minmax(0, 720px);
        }
        .card.stakecard {
          --scell: 78px;
        }
        .stakestake {
          flex-direction: row;
          gap: 14px;
        }
        .stakehalf {
          flex: 1;
        }
      }

      /* wide/landscape (1280×720): left column of stakes (300px), collection on the right,
         the bottom bar under the grid */
      @media (min-width: 1024px) {
        #stakeOverlay {
          grid-template-columns: minmax(0, 1060px);
        }
        .card.stakecard {
          --scell: 64px;
          display: grid;
          grid-template-columns: 300px minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr) auto;
          column-gap: 18px;
        }
        .stakehead {
          grid-column: 1 / -1;
        }
        .stakemain {
          display: contents;
        }
        .stakeleft {
          grid-column: 1;
          grid-row: 2;
          min-height: 0;
          overflow-y: auto;
        }
        .stakecoll {
          grid-column: 2;
          grid-row: 2;
        }
        .stakefoot {
          grid-column: 2;
          grid-row: 3;
        }
      }

      /* collection screen (B6, V20 redesign) — a full-screen menu page like «Двор»: dark asphalt,
         a round «Назад» + chalk title, the progress bar and filter chips pinned on top, series
         blocks scrolling under them. Still above the result card it can be opened from (R4). */
      #collOverlay {
        position: fixed;
        inset: 0;
        background: var(--menu-bg);
        z-index: 12;
      }
      .card.collcard {
        text-align: left;
        display: flex;
        flex-direction: column;
        width: min(100%, 620px);
        height: 100%;
        margin: 0 auto;
        padding: calc(var(--inset-top) + 14px) 18px calc(var(--inset-bottom) + 14px);
        background: transparent;
        color: var(--menu-ink);
        border-radius: 0;
      }
      .collhead {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      .card.collcard h2 {
        flex: 1;
        font-size: clamp(30px, 9vw, 40px);
        margin: 0;
        text-align: center;
      }
      .collgap {
        width: 44px;
        flex: none;
      }
      #collClose {
        flex: none;
        border-radius: 50%;
        border: 1px solid rgba(241, 238, 230, 0.22);
        background: rgba(241, 238, 230, 0.06);
        color: var(--menu-ink);
      }
      #setClose,
      #stakeMenu {
        flex: none;
        background: rgba(127, 127, 127, 0.12);
        color: var(--panel-ink);
      }
      .collstat {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
        margin-top: 10px;
      }
      #collBar {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: rgba(241, 238, 230, 0.12);
        overflow: hidden;
      }
      #collFill {
        display: block;
        height: 100%;
        width: 0;
        background: var(--menu-yellow);
      }
      #collSummary {
        margin: 0;
        font-size: 13px;
        color: #d9d4c4;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .collfilters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        flex: none;
        margin-top: 10px;
      }
      .collchip {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(241, 238, 230, 0.24);
        border-radius: 999px;
        background: transparent;
        color: var(--menu-ink);
        font: 500 14px var(--ui-font);
        cursor: pointer;
      }
      .collchip[aria-pressed='true'] {
        background: var(--menu-ink);
        border-color: var(--menu-ink);
        color: var(--menu-bg);
        font-weight: 600;
      }
      #collScroll {
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        margin-top: 12px;
      }
      .csec {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 18px;
      }
      .csechead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin: 0;
        font-weight: 400;
      }
      .csectitle {
        font: 400 26px var(--chalk-font);
      }
      .cseccount {
        font: 400 13px var(--ui-font);
        color: var(--menu-mute);
        font-variant-numeric: tabular-nums;
      }
      .cgrid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      #collEmpty {
        margin: 24px 0;
        text-align: center;
        font-size: 14px;
        color: var(--menu-mute);
      }
      .ccell {
        position: relative;
        aspect-ratio: 1;
        min-width: 44px;
        min-height: 44px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        background: none;
        cursor: pointer;
      }
      .ccell .csil {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(241, 238, 230, 0.35);
        display: grid;
        place-items: center;
        color: #8f8c82;
        font: 600 15px var(--ui-font);
      }
      .ccell.owned .csil {
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.18);
      }
      .ccell .cface {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.18s;
      }
      .ccell .cface.on {
        opacity: 1;
      }
      .ccell .cdup {
        position: absolute;
        right: -4px;
        bottom: -4px;
        min-width: 22px;
        height: 22px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--menu-yellow);
        color: var(--menu-bg);
        font: 600 12px/22px var(--ui-font);
        text-align: center;
      }
      .ccell:focus-visible {
        outline: 3px solid var(--holo);
        outline-offset: 2px;
      }
      #collDetail {
        text-align: center;
      }
      .collcard .btn {
        border-color: rgba(241, 238, 230, 0.24);
        color: var(--menu-ink);
      }
      .cdface {
        position: relative;
        width: min(60vw, 240px);
        margin: 10px auto;
        aspect-ratio: 1;
      }
      .cdface .csil {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px dashed rgba(241, 238, 230, 0.35);
        display: grid;
        place-items: center;
        font: 400 64px var(--chalk-font);
        color: #8f8c82;
      }
      .cdface img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      #cdName {
        font: 400 30px/1.1 var(--chalk-font);
        margin: 6px 0;
      }
      #cdMeta {
        white-space: pre-line;
        color: var(--menu-mute);
        font-size: 14px;
        margin: 0 0 10px;
      }

      /* yard menu (R4/R10) and settings screen — V18 redesign: the menu IS the yard (approved
         mockup) — dark asphalt, chalk lettering, a round red «Играть» inside a chalk ring, the
         rest as asphalt plates. .yardcard keeps the `.card` class: it spans the whole overlay, so
         the layout-check centre assertion still means "the composition fills the screen". */
      #yardOverlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--menu-bg);
        z-index: 10; /* under #stakeOverlay: «Играть» → stake → «Назад» lands back on the yard */
      }
      .card.yardcard {
        flex: 1;
        width: 100%;
        max-width: none;
        height: 100%;
        padding: calc(var(--inset-top) + 12px) 14px calc(var(--inset-bottom) + 14px);
        background: transparent;
        color: var(--menu-ink);
        border-radius: 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: var(--menu-gap);
      }
      .yardtop {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }
      /* the fishka counter is a small plate in the top bar; icons (sound, fullscreen) sit right */
      .yardcount {
        margin: 0;
        font: 600 14px/1 var(--ui-font);
        color: var(--menu-ink);
        background: var(--menu-panel);
        border-radius: 999px;
        padding: 10px 14px;
        box-shadow: var(--menu-cardboard);
      }
      .yardicons {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .yardmain {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--menu-gap);
      }
      .card.yardcard h2#yardTitle {
        font: 400 clamp(44px, 12vw, 64px) / 1 var(--chalk-font);
        color: var(--menu-ink);
        margin: 0;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      /* the chalk ring: the «Играть» disc in the middle, the player's fishki fanned inside */
      .yardring {
        position: relative;
        width: min(58vw, 30vh, 230px);
        aspect-ratio: 1;
        flex: none;
        border: 3px solid var(--menu-ink);
        border-radius: 50%;
        box-shadow:
          inset 0 0 20px rgba(0, 0, 0, 0.3),
          0 0 0 2px rgba(241, 238, 230, 0.08);
      }
      .yardface {
        position: absolute;
        width: 27%;
        aspect-ratio: 1;
        border-radius: 50%;
        object-fit: cover;
        transform: translate(-50%, -50%);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      }
      .yardplay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 47%;
        aspect-ratio: 1;
        border: 0;
        border-radius: 50%;
        background: var(--menu-red);
        color: #fff;
        font: 700 clamp(15px, 4.4vw, 19px) / 1.05 var(--ui-font);
        cursor: pointer;
        box-shadow: 0 6px 0 var(--menu-red-dark);
      }
      .yardplay:active {
        transform: translate(-50%, -50%) translateY(3px);
        box-shadow: 0 3px 0 var(--menu-red-dark);
      }

              <section class="stakehalf">
                <h3 class="stakesec"><span data-i18n="ui.stake.yours"></span> · <span id="stakeNeed"></span></h3>
                <div id="playerStakeList" class="stakerow" data-hud="stake-mine" data-i18n-aria="ui.stake.myList"></div>
              </section>
            </div>
            <div class="staketalk">
              <p id="stakeHint" data-hud="stake-hint" aria-live="polite"></p>
              <span id="stakeRefusals" class="stakeref" data-hud="stake-refusals"></span>
            </div>
            <!-- V22: the bot's swap offer — an in-flow card, it pushes the collection down
                 instead of covering it (.stakemain scrolls if it runs out of room). -->
            <div id="stakeOffer" class="stakeoffer" data-hud="stake-offer" hidden>
              <p id="stakeOfferText" class="stakeoffertext" aria-live="polite"></p>
              <div class="stakeofferrow">
                <div id="stakeOfferList" class="stakerow stakeofferopts" role="group"></div>
                <button class="btn stakeofferno" id="stakeOfferNo" type="button"></button>
              </div>
            </div>
          </div>
          <div class="stakecoll">
            <h3 class="stakesec" id="stakeCollHead">
              <span data-i18n="ui.stake.collection"></span>
              <span class="stakecollhint h-hover" data-i18n="ui.stake.collHintHover"></span>
              <span class="stakecollhint h-touch" data-i18n="ui.stake.collHintTouch"></span>
            </h3>
            <div id="stakeGrid" class="stakegrid" data-hud="stake-grid" role="group"></div>
            <p id="stakeSwapHint" class="stakeswap" data-hud="stake-swaphint" hidden></p>
            <div id="stakeLoan" class="stakeloan" data-hud="stake-loan" hidden></div>
          </div>
        </div>
        <div class="stakefoot">
          <button
            class="btn"
            id="stakeRandom"
            data-hud="stake-random"
            type="button"
            data-i18n="ui.stake.random"
          ></button>
          <button class="btn primary" id="stakePlay" data-hud="stake-play" disabled data-i18n="ui.action.play"></button>
        </div>
        <div id="stakeTip" class="staketip" role="tooltip" hidden></div>
      </div>
    </div>

    <!-- V19 «Пауза»: the menu over a live party (was «Двор» before the redesign). The corner
         ☰ repeats the HUD «Меню» press; the Esc note is keyboard-only (.kbonly). -->
    <div id="pauseOverlay" hidden>
      <div class="card pausecard" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
        <button
          class="iconbtn"
          id="pauseMenu"
          data-hud="pause-menu"
          type="button"
          data-i18n-aria="ui.menu.aria"
          data-i18n-title="ui.menu.aria"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div>
          <h2 id="pauseTitle" data-i18n="ui.pause.title"></h2>
          <p class="pausesub" data-i18n="ui.pause.sub"></p>
        </div>
        <div class="pausescore">
          <div class="pcell">
            <span class="plabel" data-i18n="ui.pause.you"></span
            ><span class="pnum" id="pauseScoreMe" data-hud="pause-score-me">0</span>
          </div>
          <span class="pcolon">:</span>
          <div class="pcell">
            <span class="plabel" id="pauseBotName" data-hud="pause-bot-name"></span
            ><span class="pnum" id="pauseScoreBot" data-hud="pause-score-bot">0</span>
          </div>
          <span class="psep" aria-hidden="true"></span>
          <div class="pcell">
            <span class="plabel" data-i18n="ui.pause.pile"></span
            ><span class="pnum" id="pausePot" data-hud="pause-pot">0</span>
          </div>
        </div>
        <button
          class="pausebtn primary"
          id="pauseResume"
          data-hud="pause-resume"
          type="button"
          data-i18n="ui.pause.resume"
        ></button>
        <button
          class="pausebtn"
          id="pauseSettings"
          data-hud="pause-settings"
          type="button"
          data-i18n="ui.settings.title"
        ></button>
        <button
          class="pausebtn"
          id="pauseOrder"
          data-hud="pause-order"
          type="button"
          data-i18n="ui.pause.order"
        ></button>
        <button
          class="pausebtn danger"
          id="pauseQuit"
          data-hud="pause-quit"
          type="button"
          data-i18n="ui.pause.quit"
        ></button>
        <p class="pausenote kbonly" data-hud="pause-esc" data-i18n="ui.yard.escHint"></p>
      </div>
    </div>

    <div id="yardOverlay" hidden>
      <div class="card yardcard" role="dialog" aria-modal="true" aria-labelledby="yardTitle">
        <div class="yardtop">
          <button
            class="iconbtn"
            id="yardMenu"
            data-hud="yard-menu"
            type="button"
            hidden
            data-i18n-aria="ui.menu.aria"
            data-i18n-title="ui.menu.aria"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <p class="yardcount" id="yardCount" data-hud="yard-count"></p>
          <span class="yardicons">
            <span id="yardSoundSlot"></span>
            <button class="iconbtn" id="yardFs" data-hud="yard-fs" type="button" hidden></button>
          </span>
        </div>
        <div class="yardmain">
          <h2 id="yardTitle" data-hud="yard-title" data-i18n="ui.yard.title"></h2>
          <p class="yardsub" id="yardSub" data-i18n="ui.yard.sub"></p>
          <div class="yardring">
            <div class="yardfishki" id="yardFishki" aria-hidden="true"></div>
            <button
              class="yardplay"
              id="yardPlay"
              data-hud="yard-play"
              type="button"
              data-i18n="ui.action.play"
            ></button>
          </div>
          <button
            class="yardpanel"
            id="yardResume"
            data-hud="yard-resume"
            type="button"
            hidden
            data-i18n="ui.yard.resume"
          ></button>
          <button class="yardpanel" id="yardColl" data-hud="yard-coll" type="button">
            <span data-i18n="ui.coll.title"></span><span class="yardcolln" id="yardCollCount"></span>
          </button>
          <button class="yardpanel" id="yardSettings" data-hud="yard-settings" type="button">
            <span data-i18n="ui.settings.title"></span><span class="yardnav" aria-hidden="true">›</span>
          </button>
          <p class="yardbonus" id="yardBonus" data-hud="yard-bonus">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="8" width="18" height="4" rx="1" />
              <path d="M5 12v8h14v-8" />
              <path d="M12 8v12" />
              <path d="M12 8c-2 0-4-1-4-2.5S9.5 3 11 3.5 12 8 12 8z" />
              <path d="M12 8c2 0 4-1 4-2.5S14.5 3 13 3.5 12 8 12 8z" />
            </svg>
            <span id="yardBonusText"></span>
          </p>
          <p class="setnote kbonly" id="yardEscHint" data-hud="yard-esc" hidden data-i18n="ui.yard.escHint"></p>
        </div>
      </div>
    </div>

    <div id="abandonOverlay" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="abandonTitle">
        <h2 id="abandonTitle" data-hud="abandon-title" data-i18n="ui.abandon.title"></h2>
        <p class="setnote" data-hud="abandon-text" data-i18n="ui.abandon.text"></p>
        <button class="btn" id="abandonQuit" data-hud="abandon-quit" type="button" data-i18n="ui.abandon.quit"></button>
        <button
          class="btn primary"
          id="abandonStay"
          data-hud="abandon-stay"
          type="button"
          data-i18n="ui.yard.resume"
        ></button>
      </div>
    </div>

    <div id="settingsOverlay" hidden>
      <div class="card setcard" role="dialog" aria-modal="true" aria-labelledby="setTitle">
        <div class="cardhead">
          <button
            class="iconbtn"
            id="setClose"
            data-hud="set-close"
            type="button"
            data-i18n-aria="ui.settings.close"
          ></button>
          <h2 id="setTitle" data-i18n="ui.settings.title"></h2>
          <span class="cardheadpad" aria-hidden="true"></span>
        </div>
        <div class="setlist" id="setRoot" role="group" data-i18n-aria="ui.settings.sections">
          <div class="setsec">
            <p class="setcap" data-i18n="ui.settings.secGame"></p>
            <div class="setgroup">
              <button
                class="setrow"
                id="setSound"
                data-hud="set-sound"
                data-key="master"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"
                  ><span data-i18n="ui.settings.sound"></span
                  ><span class="setsub"
                    ><span class="kbonly" data-i18n="ui.settings.soundNoteKeys"></span
                    ><span class="touchonly" data-i18n="ui.settings.soundNoteTouch"></span></span
                ></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
              <button class="setrow" id="setSecSound" data-hud="set-sec-sound" type="button">
                <span class="setmain"><span data-i18n="ui.settings.channels"></span></span>
                <span class="setcta" aria-hidden="true">›</span>
              </button>
              <button
                class="setrow"
                id="setCircle"
                data-hud="set-circle"
                data-key="circle"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"
                  ><span data-i18n="ui.settings.circle"></span
                  ><span class="setsub" data-i18n="ui.settings.circleNote"></span
                ></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                id="setVibration"
                data-hud="set-vibration"
                data-key="vibration"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"
                  ><span data-i18n="ui.settings.vibration"></span
                  ><span class="setsub" data-i18n="ui.settings.vibrationNote"></span
                ></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="setsec">
            <p class="setcap" data-i18n="ui.settings.secScreen"></p>
            <div class="setgroup">
              <button class="setrow" id="setSecLang" data-hud="set-sec-lang" type="button">
                <span class="setmain"><span data-i18n="ui.settings.language"></span></span>
                <span class="setcta"><span id="setLangVal"></span><span aria-hidden="true"> ›</span></span>
              </button>
              <button class="setrow" id="setSecFs" data-hud="set-sec-fs" type="button" hidden>
                <span class="setmain"><span data-i18n="ui.fs.title"></span></span>
                <span class="setcta"><span id="setSecFsLabel"></span><span aria-hidden="true"> ›</span></span>
              </button>
            </div>
          </div>
          <div class="setsec">
            <p class="setcap" data-i18n="ui.settings.secHelp"></p>
            <div class="setgroup">
              <button class="setrow" id="setSecTutor" data-hud="set-sec-tutor" type="button">
                <span class="setmain"><span data-i18n="ui.settings.tutorial"></span></span>
                <span class="setcta" data-i18n="ui.settings.tutorialCta"></span>
              </button>
              <button class="setrow" id="setSecShare" data-hud="set-sec-share" type="button" hidden>
                <span class="setmain"><span data-i18n="ui.share.button"></span></span>
                <span class="setcta" aria-hidden="true">›</span>
              </button>
              <div class="setrow setstatic" id="setSecSupport" data-hud="set-sec-support">
                <span class="setmain"><span data-i18n="ui.settings.support"></span></span
                ><a class="setcontact" id="setSupportVal" target="_blank" rel="noopener noreferrer"></a>
              </div>
            </div>
          </div>
          <p class="setversion" id="setVersion" data-hud="set-version"></p>
        </div>
        <div class="setlist" id="setSoundPanel" role="group" data-i18n-aria="ui.settings.channels" hidden>
          <div class="setsec">
            <div class="setgroup">
              <button class="setrow" id="setBack" data-hud="set-back" type="button">
                <span class="setmain"><span data-i18n="ui.settings.back"></span></span>
              </button>
              <button
                class="setrow"
                data-hud="set-wind"
                data-key="wind"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"><span data-i18n="ui.settings.wind"></span></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                data-hud="set-hits"
                data-key="hits"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"><span data-i18n="ui.settings.hits"></span></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                data-hud="set-birds"
                data-key="birds"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"><span data-i18n="ui.settings.birds"></span></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                data-hud="set-voice"
                data-key="voice"
                role="switch"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"><span data-i18n="ui.settings.voice"></span></span>
                <span class="setpill" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="setlist" id="setLangPanel" role="group" data-i18n-aria="ui.settings.language" hidden>
          <div class="setsec">
            <div class="setgroup">
              <button class="setrow" id="setLangBack" data-hud="set-lang-back" type="button">
                <span class="setmain"><span data-i18n="ui.settings.back"></span></span>
              </button>
              <button
                class="setrow"
                data-hud="set-lang-auto"
                data-lang=""
                role="radio"
                aria-checked="true"
                type="button"
              >
                <span class="setmain"><span data-i18n="language.auto"></span></span>
                <span class="setcta" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                data-hud="set-lang-ru"
                data-lang="ru"
                role="radio"
                aria-checked="false"
                type="button"
              >
                <span class="setmain"><span aria-hidden="true">🇷🇺 </span><span data-i18n="language.ru"></span></span>
                <span class="setcta" aria-hidden="true"></span>
              </button>
              <button
                class="setrow"
                data-hud="set-lang-en"
                data-lang="en"
                role="radio"
                aria-checked="false"
                type="button"
              >
                <span class="setmain"><span aria-hidden="true">🇬🇧 </span><span data-i18n="language.en"></span></span>
                <span class="setcta" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tutor" hidden>
      <div class="tutshade" aria-hidden="true"></div>
      <div class="tutshade" aria-hidden="true"></div>
      <div class="tutshade" aria-hidden="true"></div>
      <div class="tutshade" aria-hidden="true"></div>
      <div class="tutspot" aria-hidden="true" hidden></div>
      <div class="tutcard" role="dialog" aria-labelledby="tutorStep" aria-describedby="tutorText">
        <h2 class="tutstep" id="tutorStep" data-hud="tutor-step"></h2>
        <p id="tutorText" data-hud="tutor-text" aria-live="polite"></p>
        <div class="tutrow">
          <button class="btn" id="tutorSkip" data-hud="tutor-skip" type="button" data-i18n="ui.tutor.skip"></button>
          <button
            class="btn primary"
            id="tutorNext"
            data-hud="tutor-next"
            type="button"
            data-i18n="ui.tutor.next"
          ></button>
        </div>
      </div>
    </div>

    <div id="loading" data-i18n="ui.boot.loadingPhysics"></div>
    <div id="boot" data-i18n="game.faces.loading"></div>
  </body>
</html>
